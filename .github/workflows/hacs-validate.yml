name: HACS validation

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "plugin"
          # This repo is installed via HACS "Custom repositories", not
          # submitted to the official default store, so we only care about
          # checks that would actually break that install path. brands/images
          # are store-listing polish; license/description/topics are
          # default-store submission requirements — license in particular
          # can't be added here since most of the code is an unlicensed
          # upstream fork (see README "Lizenz und Attribution").
          ignore: "brands images license description topics"
